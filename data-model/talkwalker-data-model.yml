      - POST /api/v2/talkwalker/p/{project_id}/custom_metrics/update
      - POST /api/v2/talkwalker/p/{project_id}/custom_metrics/delete
      - DELETE /api/v2/talkwalker/p/{project_id}/custom_metrics/m/{metric_name}
  - name: tag
