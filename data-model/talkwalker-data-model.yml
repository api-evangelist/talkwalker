note: >-
  DERIVED FROM PATH STRUCTURE, NOT FROM SCHEMAS. Talkwalker's published OpenAPI declares
  `components: {securitySchemes: …}` and ZERO reusable schemas — all 50 operations inline their
  response shapes or leave them undescribed, so there is no $ref graph to walk. The entity graph
  below is therefore derived from the path hierarchy (every resource path is
  /api/vN/<surface>/p/{project_id}/<entity>) plus the documented document-field reference. Attribute
  lists are deliberately omitted rather than guessed.
root_entity: project
entities:
  - name: project
    id_field: project_id
    id_in: path
    description: >-
      The tenant-scoped workspace that owns topics, documents, datasets, tags, views, custom metrics
      and source panels. Almost every write operation and most project-scoped reads are nested under
      /p/{project_id}.
    operations:
      - GET /api/v1/search/info
    note: >-
      GET /api/v1/search/info ("List of allowed projects") is the entry point that tells a caller
      which project_ids the presented access_token may use.
  - name: document
    id_field: null
    description: >-
      A single indexed mention — a blog post, forum post, news article, review or social post — and
      the unit both the Search and Streaming APIs return, and the unit the Documents API imports and
      modifies. Field reference: https://developer.talkwalker.com/docs/talkwalker-documents/fields
    operations:
      - GET /api/v1/search/results
      - GET /api/v1/search/p/{project_id}/results
      - POST /api/v2/docs/p/{project_id}
      - POST /api/v2/docs/p/{project_id}/{action}
  - name: dataset
    id_field: dataset_id
    id_in: path
    description: >-
      A named collection inside a project that reviews are imported into and modified against.
    operations:
