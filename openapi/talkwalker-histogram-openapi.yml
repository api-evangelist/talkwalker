- apikeyAuth: []
tags:
- name: Search API > Histogram API
paths:
  /api/v1/search/histogram/{type}:
    get:
      description: Retrieve the distribution of the number of search results for a given search query. Histograms can be made
        for distribution over time or over specific metrics.
      parameters:
      - description: The query to search for.
        example: cats AND dogs
        in: query
        name: q
        required: true
        schema:
          type: string
      - description: Minimum value for bins
        in: query
        name: min
        schema:
          type: string
      - description: Maximum value for bins
        in: query
        name: max
        schema:
          type: string
      - description: 'Include min value.

          Allowed values: true or false.

          Default value: true.'
        in: query
        name: min_include
        schema:
          type: string
      - description: 'Include max value.

          Allowed values: true or false.

          Default value: false.'
        in: query
        name: max_include
        schema:
          type: string
      - description: "Bin Interval. \nDuration for published and search_indexed / Integer for histogram / not used for distribution."
        in: query
        name: interval
        schema:
          type: string
      - description: 'Timezone for the duration interval (e.g. Europe/Luxembourg).

          Allowed values are timezone names.

          Default value: UTC'
        example: UTC
        in: query
        name: timezone
        schema:
          type: string
      - description: 'Nested histogram.

          Allowed values: sentiment, sourcetype, country.'
        example: sentiment
        in: query
        name: breakdown
        schema:
          type: string
      - description: Nested metric for time based histograms.
        example: engagement
        in: query
        name: value_type
        schema:
          type: string
      - description: Size limiter for demographic distribution.
        example: '10'
        in: query
        name: top_n
        schema:
          type: integer
      - example: published
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
