          application/json:
            schema:
              type: object
              example:
                url: https://test_ci_pcl.lu/review/1
                parent_url: https://test_ci_pcl.lu/review/1
                title: This is my review
                content: So excited about this API
                published: '1690722383000'
                source_type:
                - MONITOREDSITE_OTHER
                extra_source_attributes:
