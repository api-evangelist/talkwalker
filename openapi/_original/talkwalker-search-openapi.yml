      parameters:
      - description: The query to search for.
        example: cats AND dogs
        in: query
        name: q
        required: true
        schema:
          type: string
      - description: Topic on which summary should focus
        example: food
        in: query
        name: custom_focus
        schema:
          type: string
      - description: 'Timezone for the time_range (e.g. Europe/Luxembourg).

          Allowed values are timezone names.

          Default value: UTC'
        example: CET
        in: query
        name: timezone
        schema:
          type: string
      - description: 'Time range filter.

          Format `number` + a time unit character (e.g. `30d` for 30 days.).'
        example: 30d
        in: query
        name: time_range
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status_code: '0'
                status_message: OK
                request: GET /api/v1/search/summary?q=cats%20AND%20dogs&access_token=abcd_1234_abcd
                request_id: '#rxl5is2tsjc1#'
                summary:
                  summary: The collection of online documents reveals a strong interest in pets, particularly cats and dogs,
                    with discussions around their behavior, care, and emotional connection with humans. Animal welfare and
                    rescue efforts are prominent themes, highlighted by news releases about organizations reuniting lost pets
                    and investigations into animal neglect. Social media trends, including viral memes and puzzle toys for
                    pets, demonstrate engagement with animal-related content. Furthermore, there’s a notable interest in broader
                    geopolitical issues and personal reflections on life’s challenges.
