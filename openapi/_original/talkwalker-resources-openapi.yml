  /api/v2/talkwalker/p/{project_id}/custom_metrics/update:
    post:
      tags:
      - Resources API
      summary: Update custom metrics
      description: Changing the name or the type is not allowed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                custom_metrics:
                - name: metric1
                  title: 1st metric
                  description: ''
                  display_in_ui: false
                - name: metric2
                  title: Category
                  description: ''
                  display_in_ui: true
      parameters:
      - name: project_id
        in: path
        schema:
          type: string
        required: true
        example: '{{project_id}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status_code: '0'
                status_message: OK
