                result_topic_details:
                  id: kpnutesu_1234
                  title: Tesla
                  description: ''
                  category_id: default
                  category_title: ''
                  category_description: ''
                  included_queries:
                  - tesla AND "electric car" AND lang:en
                  excluded_queries:
                  - (noisecategory:financial_news OR noisecategory:promotions)
                  type: SEARCH
