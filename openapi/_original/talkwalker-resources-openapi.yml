  /api/v2/talkwalker/p/{project_id}/topics/list/{topic_id}:
    get:
      tags:
      - Topic API
      summary: Retrieve definition of a specific topic
      description: In order to only get the definition of a specific topic or custom filter when calling the endpoint, we
        can add the topic ID to the endpoint.
      parameters:
      - name: project_id
        in: path
        schema:
          type: string
        required: true
        example: '{{project_id}}'
      - name: topic_id
        in: path
        schema:
          type: string
        required: true
        description: topic ID or filter ID
        example: kpnutesu_5imm9mo4lbsj
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status_code: '0'
                status_message: OK
                request: GET /api/v2/talkwalker/p/a1ab1abc-a123-123a-123a-abcd12ab1a12/topics/list/kpnutesu_5imm9mo4lbsj?access_token=abcd_1234_abcd
