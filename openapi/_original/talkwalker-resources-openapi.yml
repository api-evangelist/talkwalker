  /api/v2/talkwalker/p/{project_id}/custom_metrics/add:
    post:
      tags:
      - Resources API
      summary: Add custom metrics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                custom_metrics:
                - name: metric1
                  title: 1st metric
                  description: ''
                  display_in_ui: true
                  format: INTEGER
