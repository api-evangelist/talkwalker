generated: '2026-08-13'
method: searched
source: https://developer.talkwalker.com/docs/getting-started/api-restrictions
name: Talkwalker API Rate Limits
description: >-
  Per-endpoint call rate limits enforced by the Talkwalker REST API. Limits vary by endpoint type and
  by whether the call is scoped inside a project or performed outside a project (e.g. quicksearch
  context).
url: https://developer.talkwalker.com/docs/getting-started/api-restrictions
docs:
  api_restrictions: https://developer.talkwalker.com/docs/getting-started/api-restrictions
  credits_pricing: https://developer.talkwalker.com/docs/getting-started/credits-pricing
  error_codes: https://developer.talkwalker.com/docs/troubleshooting/error-codes
limit_count: 8

response_headers: []
response_header_note: >-
  Talkwalker publishes NO rate-limit response headers — no X-RateLimit-Limit/Remaining/Reset, no
  RateLimit-* (RFC 9238 draft), and no Retry-After. An agent cannot read its remaining budget or a
  recommended backoff from any response; the only runtime signal is the error itself, and the only
  budget signal is polling GET /api/v1/status/credits (itself capped at 10 calls/min). This is the
  single largest runtime-semantics gap in the API.
exhaustion:
  - condition: per-endpoint call-rate limit exceeded
    http_status: 401
    status_code: '8'
    status_message: Call limit exceeded for this endpoint
    note: >-
      Talkwalker returns 401, NOT 429, for call-rate exhaustion. A client that treats 401 as an
      authentication failure will re-authenticate in a loop instead of backing off.
  - condition: maximum concurrent streams reached
    http_status: 429
    status_code: '30'
    status_message: Limit of maximum concurrent streams reached
  - condition: account credits exhausted
    http_status: 401
    status_code: '9'
    status_message: No credits left
    note: Quota exhaustion, not rate exhaustion — backoff will not clear it until the monthly reset.

limits:
  - endpoint: Search API (outside project / quicksearch)
    path: GET /api/v1/search/results
    scope: per-account
    limit: 240
    window: 1 minute
    unit: calls per minute
  - endpoint: Search API (inside project)
    path: GET /api/v1/search/p/{project_id}/results
    scope: per-account
    limit: 60
    window: 1 minute
    unit: calls per minute
  - endpoint: Histogram API (outside project / quicksearch)
    path: GET /api/v1/search/histogram/{type}
    scope: per-account
    limit: 60
    window: 1 minute
    unit: calls per minute
  - endpoint: Histogram API (inside project)
    path: GET /api/v1/search/p/{project_id}/histogram/{type}
    scope: per-account
    limit: 30
    window: 1 minute
    unit: calls per minute
  - endpoint: Document Import API
    path: POST /api/v2/docs/p/{project_id}
    scope: per-account
    limit: 120
    window: 1 minute
    unit: calls per minute
  - endpoint: Resources endpoint
    path: GET /api/v2/talkwalker/p/{project_id}/resources
    scope: per-account
    limit: 20
    window: 1 minute
    unit: calls per minute
    note: Results should be cached rather than re-fetched repeatedly.
  - endpoint: Tags endpoint
    path: GET /api/v2/talkwalker/p/{project_id}/tags
    scope: per-account
    limit: 40
    window: 1 minute
    unit: calls per minute
    note: Results should be cached rather than re-fetched repeatedly.
  - endpoint: Views endpoint (dashboards, reports, alerts)
    path: GET /api/v2/talkwalker/p/{project_id}/views
    scope: per-account
    limit: 20
    window: 1 minute
    unit: calls per minute
    note: Results should be cached rather than re-fetched repeatedly.
  - endpoint: Remaining Credits endpoint
    path: GET /api/v1/status/credits
    scope: per-account
    limit: 10
    window: 1 minute
    unit: calls per minute
    note: Talkwalker recommends storing the result rather than polling frequently.
    source: https://developer.talkwalker.com/docs/getting-started/credits-pricing

quota:
  unit: credits
  reset: Monthly, on the day of the subscription, at 03:00 UTC.
  costs:
    - surface: Search API
      cost: 1 credit per result plus a minimum of 10 credits per call
    - surface: Streaming API
      cost: 1 credit per result, no per-call minimum
    - surface: Histogram API
      cost: 10 credits per call
    - surface: Document import
      cost: free
  balance_endpoint: GET /api/v1/status/credits
  balance_fields:
    - used_credits_monthly
    - used_credits_onetime
    - remaining_credits_monthly
    - remaining_credits_onetime
    - next_billing_period
    - estimate_credits_used_until_end_of_billing_period
    - monthly_total
    - used_credits_processing
    - remaining_allowance_processing
    - credits_history
    - twitter_resyndication
  source: https://developer.talkwalker.com/docs/getting-started/credits-pricing

export_restrictions:
  - source: Facebook and Instagram
    restriction: Content cannot be exported via API; only aggregated metrics are available (Histogram API).
  - source: X (Twitter)
    restriction: >-
      Only tweet ID, author ID, and Talkwalker's sentiment score are exportable; rehydrate via X's own
      API. Capped at 1.5 million documents per month per account. The X data add-on lifts this to
      full post-level content and metrics.
  - source: News content and TV Eyes
    restriction: >-
      Full articles are truncated for copyright; only content_snippet is provided, with matching
      keywords wrapped in <b> tags.
  - source: LinkedIn
    restriction: Export not supported.
  - source: Chinese platforms (e.g. Weibo), Disqus, MONITOREDSITE, WEB_NLA, certain review sites
    restriction: Export not supported or limited by data-provider agreement (subject to change).
  - source: Reddit and TikTok
    restriction: Raw documents not exportable; aggregated metrics exportable via the Histogram API.

import_restrictions:
  - Social media documents cannot be imported via the API.
