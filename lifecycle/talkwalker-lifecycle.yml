  detail: >-
    status.talkwalker.com is a real Atlassian Statuspage, titled "Hootsuite Inc. Status" and carrying
    Talkwalker-named components. Talkwalker was acquired by Hootsuite, so the parent brand on the
    status page is expected, not a mismatch — the page is served from Talkwalker's own subdomain and
    names Talkwalker components explicitly. Email and SMS incident subscriptions are offered.
  note: >-
    The standard Statuspage JSON endpoints (/api/v2/status.json, /history.rss) did NOT return machine
    -readable documents on this deployment — both returned the same 109,892-byte HTML page as the
    root, so an agent cannot poll status programmatically.
