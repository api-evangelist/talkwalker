versioning:
  scheme: uri-path
  current: v3
  versions_live: [v1, v2, v3]
  docs: https://developer.talkwalker.com/api/
  detail: >-
    Three major versions are served concurrently from https://api.talkwalker.com and each carries a
    DIFFERENT product surface rather than a newer edition of the same one: /api/v1 (search, summary,
    histogram, status/credits), /api/v2 (document modification, resources, topics, source panels,
    custom metrics, image detection), /api/v3 (streaming, collectors, export tasks). The published
    OpenAPI declares info.version "0.0.1", which does not track the path versions.
